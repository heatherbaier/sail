# SUPERSEDED for AZ/GA/CA/PA going forward -- see
# uswealth-geoai/pipeline_configs/state_registry.yml, the merged registry
# covering both this and geoetl's per-state settings. Kept here only for
# AZ reference until it's migrated there (PA is already set up directly
# in the new registry instead of here).
#
# Per-state settings that MUST stay identical across every quarter/year/
# variable trained for that state -- see scripts/generate_train_config.py,
# which reads this file so you never have to copy-paste these by hand.
#
# spatial_block_deg: from scripts/find_spatial_block_deg.py's sweep against
#   that state's real tract layout (a single number that works for one
#   state can be wrong for another -- see the AZ vs GA sweep discussion).
# band_mean / band_std: from scripts/compute_shared_band_stats.py, pooled
#   across that state's quarters -- NOT sail's per-quarter auto-computed
#   default (see the normalization discussion re: erasing cross-quarter
#   flatness signal).
# data_root_template / base_prefix_template: Python .format() strings,
#   filled in with state/year/quarter by generate_train_config.py. Must
#   match this state's actual directory/prefix convention on disk --
#   confirm against a real geoetl output.root / sail dataset.prefix for
#   this state before trusting the generator's output.

az:
  fips: "04"
  data_root_template: "/data/hbaier/new_data/tlag/az_imagery/q{quarter}_{year}_s2_allbands/"
  base_prefix_template: "az_{year}_q{quarter}_s2_allbands"
  in_channels: 12
  spatial_block_deg: 0.15
  band_mean: [0.09006, 0.100938, 0.140538, 0.182718, 0.209559, 0.236259, 0.247468, 0.252709, 0.257845, 0.260785, 0.279013, 0.239055]
  band_std: [0.061981, 0.066142, 0.071373, 0.087151, 0.086127, 0.083298, 0.084512, 0.087946, 0.085348, 0.084769, 0.09928, 0.095399]

# TODO: confirm GA's actual data_root/prefix convention (only its
# spatial_block_deg sweep has been run so far) and fill in data_root_template/
# base_prefix_template/band_mean/band_std before generating GA configs --
# the generator refuses to run for a state with any null field below.
ga:
  fips: "13"
  data_root_template: "/data/hbaier/new_data/tlag/ga_imagery/q{quarter}_{year}_s2_allbands/"
  base_prefix_template: "ga_{year}_q{quarter}_s2_allbands"
  in_channels: 12
  spatial_block_deg: 0.15
  band_mean: [0.047564, 0.046274, 0.068636, 0.065091, 0.107091, 0.206508, 0.240632, 0.250842, 0.267487, 0.274737, 0.202095, 0.120538]
  band_std:  [0.054595, 0.054495, 0.055723, 0.062511, 0.064379, 0.088588, 0.102902, 0.101381, 0.106818, 0.12025, 0.095319, 0.081527]

# TODO: run find_spatial_block_deg.py and compute_shared_band_stats.py for
# CA once its imagery is downloaded, then fill in every field below.
ca:
  fips: "06"
  data_root_template: null
  base_prefix_template: null
  in_channels: 12
